on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

name: CI

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
        toolchain:
          - stable
          - nightly
          - beta
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run cargo build
        run: cargo build --release --target ${{ matrix.target }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUST_LOG: trace
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # - name: Check service certificates
      #   run: curl -kvI https://localhost:14000/dir

      - name: Run cargo test
        run: cargo test --all-features -- --no-capture
        env:
          GHA_PEBBLE_SERVICES: "false"

    # services:
    #   pebble:
    #     image: ghcr.io/letsencrypt/pebble:latest
    #     command: -config test/config/pebble-config.json -strict -dnsserver challtestsrv:8053
    #     ports:
    #       - 14000:14000 # HTTPS ACME API
    #       - 15000:15000 # HTTPS Management API
    #   challtestsrv:
    #     image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    #     ports:
    #       - 8055:8055 # HTTP Management API
    #       - 8053:8053 # DNS Server
    #       - 5001:5001 # TLS-ALPN-01
    #       - 5002:5002 # HTTP-01
    #       - 5003:5003 # HTTP-01 via HTTPS

  lints:
    name: Lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-Dwarnings"
        run: cargo doc --all-features --no-deps
